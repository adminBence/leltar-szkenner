<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leltár admin</title>
<style>
  :root{
    --bg:#0d1210;
    --panel:#161d1a;
    --panel-2:#1f2925;
    --line:#2a3530;
    --text:#eef2f0;
    --text-dim:#8fa199;
    --accent:#3ecf8e;
    --accent-dim:#1f6b4c;
    --warn:#e0a63e;
    --danger:#e0553e;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; min-height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  #app{max-width:920px; margin:0 auto; padding:0 20px 60px;}

  header{padding:22px 0 16px; border-bottom:1px solid var(--line); margin-bottom:20px;
    display:flex; align-items:center; justify-content:space-between;}
  header h1{font-size:20px; margin:0;}
  header .sub{font-size:12px; color:var(--text-dim); margin-top:2px;}

  nav{display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  nav button{background:none; border:none; color:var(--text-dim); font-size:14px; font-weight:600;
    padding:10px 4px; margin-right:20px; border-bottom:2px solid transparent; cursor:pointer;}
  nav button.active{color:var(--text); border-bottom-color:var(--accent);}

  .panel{display:none;}
  .panel.active{display:block;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:16px;}
  .cardTitle{font-size:13px; font-weight:700; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.04em; margin-bottom:14px;}

  input[type=text], input:not([type]){
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--text); font-size:14px; width:100%;}
  button{cursor:pointer; font-family:inherit;}
  .btn{padding:10px 18px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14px; font-weight:600;}
  .btn.primary{background:var(--accent); color:#06231a; border:none;}
  .btn.danger{background:var(--danger); color:#fff; border:none;}
  .btn:disabled{opacity:.4; cursor:default;}

  .row{display:flex; gap:10px; align-items:center;}
  .row > input{flex:1;}

  /* ---------- Szektorok ---------- */
  .sectorRow{display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:10px; margin-bottom:8px;}
  .sectorRow button{background:none; border:none; color:var(--danger); font-size:16px;}
  .emptyNote{color:var(--text-dim); font-size:14px;}

  /* ---------- Leltár ---------- */
  .typeChoice{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .typeChoice label{display:flex; align-items:center; gap:10px; padding:12px 14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; font-size:14px;}
  #productTypeList{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  #productTypeList label{display:flex; align-items:center; gap:6px; padding:8px 12px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:999px; font-size:13px;}

  .activeLeltarCard{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;}
  .activeLeltarCard .qrBox{flex:0 0 auto; background:#fff; padding:10px; border-radius:10px;}
  .activeLeltarCard .info{flex:1; min-width:220px;}
  .activeLeltarCard .codeValue{font-size:30px; font-weight:800; letter-spacing:.1em; margin-bottom:8px;}
  .activeLeltarCard .metaLine{font-size:13px; color:var(--text-dim); margin-bottom:4px;}

  .diffRow{display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; margin-bottom:8px;}
  .diffRow input[type=checkbox]{margin-top:4px; flex:0 0 auto; width:18px; height:18px; accent-color:var(--accent);}
  .diffRow .info{flex:1; min-width:0;}
  .diffRow .info b{display:block; font-size:14px;}
  .diffRow .info span{font-size:11px; color:var(--text-dim); display:block; margin-top:2px;}
  .diffRow .diffVal{font-size:16px; font-weight:800; min-width:70px; text-align:right;}
  .diffVal.pos{color:var(--accent);}
  .diffVal.neg{color:var(--danger);}
  .diffVal.zero{color:var(--text-dim);}
  .otherWarehouses{font-size:11px; color:var(--text-dim); margin-top:4px;}
  .sectorBreakdown{font-size:11px; color:var(--text-dim); margin-top:6px; display:flex; flex-wrap:wrap; gap:6px;}
  .sectorBreakdown span{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:2px 7px;}
  .recountNote{font-size:11px; color:var(--warn); margin-top:4px;}

  /* ---------- Haladás ("Eddig beolvasott adatok") ---------- */
  .progressRow{display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; margin-bottom:6px; font-size:14px;}
  .progressRow .meta{font-size:11px; color:var(--text-dim);}

  /* ---------- Összesítő ---------- */
  .summaryGrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px;}
  .summaryBox{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px;}
  .summaryBox .num{font-size:20px; font-weight:800;}
  .summaryBox .lbl{font-size:11px; color:var(--text-dim); margin-top:2px;}

  /* ---------- Felelősök ---------- */
  .felelosRow{display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; margin-bottom:6px; font-size:13px;}

  /* ---------- Előzmények ---------- */
  .historyRow{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    margin-bottom:8px; cursor:pointer;}
  .historyRow .meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .statusPill{font-size:11px; padding:3px 9px; border-radius:999px; font-weight:700;}
  .statusPill.folyamatban{background:var(--accent-dim); color:var(--accent);}
  .statusPill.lezart{background:var(--panel); color:var(--text-dim); border:1px solid var(--line);}

  /* ---------- Ellenőrzés ---------- */
  .checkResultCard .modelName{font-size:18px; font-weight:700; margin-bottom:2px;}
  .checkResultCard .modelCode{font-size:12px; color:var(--text-dim); margin-bottom:14px;}
  .checkSizeRow{display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .checkSizeRow:last-child{border-bottom:none;}
  .checkSizeRow .qty{font-weight:700;}
  .checkSizeRow .qty.zero{color:var(--danger);}
</style>
</head>
<body>
<div id="app">

  <header>
    <div>
      <h1>Leltár admin</h1>
      <div class="sub">Szektorok, leltár-indítás és eltérés-riport</div>
    </div>
  </header>

  <nav>
    <button class="navBtn active" data-panel="leltar">Leltár</button>
    <button class="navBtn" data-panel="history">Korábbi leltárak</button>
    <button class="navBtn" data-panel="check">Ellenőrzés</button>
  </nav>

  <!-- LELTÁR -->
  <div class="panel active" id="panel-leltar">
    <div class="card" id="activeLeltarakCard" style="display:none;">
      <div class="cardTitle">Futó leltár</div>
      <div id="activeLeltarakBody"></div>
    </div>

    <div class="card" id="startLeltarCard">
      <div class="cardTitle">Új leltár indítása</div>
      <div class="typeChoice">
        <label><input type="radio" name="leltarTipus" value="teljes" checked> Teljes vakleltár</label>
        <label><input type="radio" name="leltarTipus" value="termektipus"> Vakleltár terméktípus szerint</label>
      </div>
      <div id="productTypeList" style="display:none;"></div>
      <div class="row" style="margin-bottom:10px;">
        <input type="text" id="adminNameInput" placeholder="A neved">
      </div>
      <button class="btn primary" id="startLeltarBtn">Leltár indítása</button>
      <div id="startLeltarMsg" style="margin-top:10px; font-size:13px; color:var(--text-dim);"></div>
    </div>

    <div id="reportContainer"></div>
  </div>

  <!-- KORÁBBI LELTÁRAK -->
  <div class="panel" id="panel-history">
    <div class="card">
      <div class="cardTitle">Korábbi leltárak</div>
      <div id="historyList"><p class="emptyNote">Betöltés…</p></div>
    </div>
    <div id="historyReportContainer"></div>
  </div>

  <!-- ELLENŐRZÉS -->
  <div class="panel" id="panel-check">
    <div class="card">
      <div class="cardTitle">Vonalkód alapján készlet-lekérdezés</div>
      <div class="row">
        <input type="text" id="checkBarcodeInput" placeholder="Vonalkód beírása vagy beolvasása">
        <button class="btn primary" id="checkBtn">Keresés</button>
      </div>
    </div>
    <div class="card" id="checkResultCard" style="display:none;"></div>
  </div>

</div>

<script>
try {

/* =========================================================================
   BACKEND HÍVÁSOK — ugyanaz a Code.gs, mint a scanner.html-nél.
   ========================================================================= */
let APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwlZfz8f_nn8X_AIFciyi42OL81xkTWAXcPfczqYo_xjb7KtYIVKrkGWVpe8iYjMWAKzQ/exec";
const APPS_SCRIPT_KEY = "oaYB9SYL15UkpopXllHgYZRjD6sGk6iD";

// A telefonos szkenner oldal (scanner.html) elérési útja — ezt írd át a
// saját GitHub Pages linkedre. A QR-kód ide fog mutatni egy ?join=KÓD
// paraméterrel, hogy a telefon SAJÁT kamera-appjával beolvasva is
// automatikusan megnyíljon és csatlakozzon a leltárhoz.
const SCANNER_URL = "https://adminbence.github.io/leltar-szkenner/";

async function apiGet(params) {
  const qs = Object.entries({ ...params, key: APPS_SCRIPT_KEY })
    .map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&");
  const res = await fetch(`${APPS_SCRIPT_URL}?${qs}`);
  return res.json();
}
async function apiPost(body) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ ...body, key: APPS_SCRIPT_KEY }),
  });
  return res.json();
}

const el = (id) => document.getElementById(id);
function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str == null ? "" : str;
  return d.innerHTML;
}

/* =========================================================================
   NAVIGÁCIÓ
   ========================================================================= */
document.querySelectorAll(".navBtn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".navBtn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    el("panel-" + btn.dataset.panel).classList.add("active");
    if (btn.dataset.panel === "leltar") loadActiveLeltarak();
    if (btn.dataset.panel === "history") loadHistory();
  });
});

/* =========================================================================
   SEGÉDFÜGGVÉNYEK
   ========================================================================= */
function formatDateTime(raw) {
  if (!raw) return "—";
  try {
    const d = new Date(raw);
    if (isNaN(d.getTime())) return String(raw);
    return d.toLocaleDateString("hu-HU") + " " + d.toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit" });
  } catch (e) { return String(raw); }
}
function formatFt(n) {
  const num = Math.round(Number(n) || 0);
  return num.toLocaleString("hu-HU") + " Ft";
}

/* =========================================================================
   LELTÁR INDÍTÁSA
   ========================================================================= */
let selectedProductTypes = new Set();

document.querySelectorAll('input[name="leltarTipus"]').forEach(r => {
  r.addEventListener("change", async (e) => {
    const listWrap = el("productTypeList");
    if (e.target.value === "termektipus") {
      listWrap.style.display = "flex";
      listWrap.innerHTML = `<span class="emptyNote">Terméktípusok betöltése…</span>`;
      try {
        const data = await apiGet({ action: "producttypes" });
        const types = data.types || [];
        listWrap.innerHTML = types.length
          ? types.map(t => `<label><input type="checkbox" class="typeCheck" value="${escapeHtml(t)}"> ${escapeHtml(t)}</label>`).join("")
          : `<span class="emptyNote">Nem található terméktípus.</span>`;
        listWrap.querySelectorAll(".typeCheck").forEach(cb => {
          cb.addEventListener("change", () => {
            if (cb.checked) selectedProductTypes.add(cb.value);
            else selectedProductTypes.delete(cb.value);
          });
        });
      } catch (e) {
        listWrap.innerHTML = `<span class="emptyNote">Hiba: ${escapeHtml(e.message)}</span>`;
      }
    } else {
      listWrap.style.display = "none";
    }
  });
});

el("startLeltarBtn").addEventListener("click", async () => {
  const tipus = document.querySelector('input[name="leltarTipus"]:checked').value;
  const name = el("adminNameInput").value.trim();
  if (!name) { el("startLeltarMsg").textContent = "Add meg a neved."; return; }

  const btn = el("startLeltarBtn");
  btn.disabled = true;
  btn.textContent = "Indítás…";
  el("startLeltarMsg").textContent = "";
  try {
    const result = await apiPost({
      action: "create_leltar",
      inditotta: name,
      tipus: tipus,
      termektipusok: Array.from(selectedProductTypes),
    });
    if (result.error) {
      el("startLeltarMsg").textContent = result.error;
    } else {
      el("reportContainer").innerHTML = "";
      loadActiveLeltarak();
    }
  } catch (e) {
    el("startLeltarMsg").textContent = "Hiba: " + e.message;
  }
  btn.disabled = false;
  btn.textContent = "Leltár indítása";
});

/* =========================================================================
   FUTÓ LELTÁR KÁRTYA
   ========================================================================= */
async function loadActiveLeltarak() {
  const card = el("activeLeltarakCard");
  const body = el("activeLeltarakBody");
  try {
    const data = await apiGet({ action: "active_leltarak" });
    const list = data.leltarak || [];
    if (!list.length) {
      card.style.display = "none";
      return;
    }
    card.style.display = "block";
    body.innerHTML = list.map(l => `
      <div class="activeLeltarCard">
        <div id="qrWrap-${escapeHtml(l.leltar_id)}" class="qrBox">
          <canvas width="150" height="150"></canvas>
        </div>
        <div class="info">
          <div class="metaLine" style="font-size:16px; font-weight:700; color:var(--text);">
            Leltár indítva: ${escapeHtml(formatDateTime(l.inditva))}
          </div>
          <div class="metaLine">Indította: ${escapeHtml(l.inditotta)} · Típus: ${escapeHtml(l.tipus)} · Raktár: ${escapeHtml(l.raktar)}</div>
          <div class="metaLine">Csatlakozási kód: <b>${escapeHtml(l.csatlakozasi_kod)}</b></div>
          <div class="row" style="margin-top:10px; gap:8px;">
            <button class="btn" data-progress="${escapeHtml(l.leltar_id)}">Eddig beolvasott adatok</button>
            <button class="btn" data-report="${escapeHtml(l.leltar_id)}">Eltérés-riport megnyitása</button>
          </div>
          <div id="progressWrap-${escapeHtml(l.leltar_id)}" style="margin-top:12px; display:none;"></div>
        </div>
      </div>
    `).join("");
    list.forEach(l => renderQrInto(`qrWrap-${l.leltar_id}`, buildJoinUrl(l.csatlakozasi_kod)));
    body.querySelectorAll("button[data-progress]").forEach(btn => {
      btn.addEventListener("click", () => toggleProgress(btn.dataset.progress));
    });
    body.querySelectorAll("button[data-report]").forEach(btn => {
      btn.addEventListener("click", () => openReport(btn.dataset.report, el("reportContainer"), { showActions: true }));
    });
  } catch (e) {
    card.style.display = "block";
    body.innerHTML = `<p class="emptyNote">Hiba: ${escapeHtml(e.message)}</p>`;
  }
}

async function toggleProgress(leltarId) {
  const wrap = el("progressWrap-" + leltarId);
  if (wrap.style.display === "block") { wrap.style.display = "none"; return; }
  wrap.style.display = "block";
  wrap.innerHTML = `<p class="emptyNote">Betöltés…</p>`;
  try {
    const data = await apiGet({ action: "progress", leltar_id: leltarId });
    wrap.innerHTML = renderProgressHtml(data.progress || []);
  } catch (e) {
    wrap.innerHTML = `<p class="emptyNote">Hiba: ${escapeHtml(e.message)}</p>`;
  }
}

function renderProgressHtml(progress) {
  if (!progress.length) return `<p class="emptyNote">Még nincs egyetlen beolvasás sem ebben a leltárban.</p>`;
  return progress.map(p => `
    <div class="progressRow">
      <span><b>${escapeHtml(p.szektor)}. szektor</b> — ${p.tetel_fajta} féle tétel, ${p.db_osszesen} db összesen</span>
      <span class="meta">${escapeHtml(formatDateTime(p.utolso_beolvasas))}</span>
    </div>
  `).join("");
}

/* =========================================================================
   TELJES RIPORT (élő vagy korábbi leltárhoz egyaránt)
   ========================================================================= */
async function openReport(leltarId, container, opts) {
  container.innerHTML = `<div class="card"><p class="emptyNote">Riport betöltése…</p></div>`;
  container.scrollIntoView({ behavior: "smooth" });
  try {
    const report = await apiGet({ action: "full_report", leltar_id: leltarId });
    if (report.error) { container.innerHTML = `<div class="card"><p class="emptyNote">Hiba: ${escapeHtml(report.error)}</p></div>`; return; }
    renderFullReport(container, report, opts || {});
  } catch (e) {
    container.innerHTML = `<div class="card"><p class="emptyNote">Hiba: ${escapeHtml(e.message)}</p></div>`;
  }
}

function renderFullReport(container, report, opts) {
  const { leltar, diff, osszesito, szektor_felelosok, progress } = report;
  const isOpen = leltar.statusz === "folyamatban";
  const showActions = !!opts.showActions && isOpen;

  const felelosHtml = [
    ...szektor_felelosok.beolvasasok.map(f => ({ ...f, tipus: "beolvasás" })),
    ...szektor_felelosok.ujraszamolasok.map(f => ({ ...f, tipus: "újraszámolás" })),
  ].map(f => `
    <div class="felelosRow">
      <span>${escapeHtml(f.szektor)}. szektor — ${escapeHtml(f.felhasznalo)} (${f.tipus})</span>
      <span class="meta">${f.tetel_fajta} féle tétel</span>
    </div>
  `).join("") || `<p class="emptyNote">Nincs adat.</p>`;

  container.innerHTML = `
    <div class="card">
      <div class="cardTitle">${isOpen ? "Leltár állapota" : "Lezárt leltár"}</div>
      <div class="metaLine" style="font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px;">
        Leltár indítva: ${escapeHtml(formatDateTime(leltar.inditva))}
      </div>
      ${!isOpen ? `<div class="metaLine" style="margin-bottom:4px;">Leltár vége: ${escapeHtml(formatDateTime(leltar.lezarva))}</div>` : ""}
      <div class="metaLine" style="margin-bottom:14px;">
        Indította: ${escapeHtml(leltar.inditotta)} · Típus: ${escapeHtml(leltar.tipus)} · Raktár: ${escapeHtml(leltar.raktar)}
        · Státusz: <span class="statusPill ${isOpen ? "folyamatban" : "lezart"}">${isOpen ? "Folyamatban" : "Lezárva"}</span>
      </div>

      <div class="summaryGrid">
        <div class="summaryBox"><div class="num">${osszesito.elteres_tetelek_szama}</div><div class="lbl">eltérő tétel a ${osszesito.osszes_tetel_szama}-ból</div></div>
        <div class="summaryBox"><div class="num">${formatFt(osszesito.elteres_ertek_netto)}</div><div class="lbl">eltérés értéke (nettó, előjeles)</div></div>
        <div class="summaryBox"><div class="num">${formatFt(osszesito.elteres_ertek_abszolut)}</div><div class="lbl">eltérés értéke (abszolút)</div></div>
      </div>

      <div class="cardTitle">Szektoronkénti haladás</div>
      ${renderProgressHtml(progress)}

      <div class="cardTitle" style="margin-top:16px;">Ki mit csinált</div>
      ${felelosHtml}
    </div>

    <div class="card" id="verifyQrCard" style="display:none;"></div>

    <div class="card">
      <div class="cardTitle">Eltérés-riport, tételesen</div>
      ${showActions ? `<div class="row" style="margin-bottom:14px; gap:8px;">
        <button class="btn primary" id="createVerifyBtn">Kiválasztottak ellenőrzése (új QR)</button>
        <button class="btn danger" id="closeLeltarActionBtn" data-leltar="${escapeHtml(leltar.leltar_id)}">Leltár lezárása</button>
      </div>` : ""}
      <div id="diffListWrap">
        ${diff.map(r => renderDiffRowHtml(r, showActions)).join("") || `<p class="emptyNote">Nincs tétel.</p>`}
      </div>
    </div>
  `;

  if (showActions) {
    el("createVerifyBtn").addEventListener("click", () => createVerificationRoundForSelected(leltar.leltar_id));
    el("closeLeltarActionBtn").addEventListener("click", () => closeLeltarAction(leltar.leltar_id));
    container.querySelectorAll(".diffSelect").forEach(cb => {
      cb.addEventListener("change", () => {
        if (cb.checked) selectedDiffBarcodes.add(cb.value);
        else selectedDiffBarcodes.delete(cb.value);
      });
    });
  }
}

function renderDiffRowHtml(r, showCheckbox) {
  const cls = r.elteres > 0 ? "pos" : (r.elteres < 0 ? "neg" : "zero");
  const sign = r.elteres > 0 ? "+" : "";
  const others = (r.masik_raktar || []).map(o => `${escapeHtml(o.raktar)}: ${o.mennyiseg} db`).join(" · ");
  const sectorChips = (r.szektorok || []).map(s =>
    `<span>${escapeHtml(s.szektor)}. szektor: ${s.mennyiseg} db${s.forras === "ujraszamolas" ? " (újraszámolva)" : ""}</span>`
  ).join("");
  const recountCount = (r.ujraszamolasok || []).length;
  const recountNote = recountCount
    ? `<div class="recountNote">Újraszámolva ${recountCount} alkalommal — utoljára: ${escapeHtml(formatDateTime(r.ujraszamolasok[r.ujraszamolasok.length - 1].idobelyeg))}, ${escapeHtml(r.ujraszamolasok[r.ujraszamolasok.length - 1].felhasznalo)}</div>`
    : "";
  return `
    <div class="diffRow">
      ${showCheckbox && r.elteres !== 0 ? `<input type="checkbox" class="diffSelect" value="${escapeHtml(r.vonalkod)}">` : (showCheckbox ? `<span style="width:18px;"></span>` : "")}
      <div class="info">
        <b>${escapeHtml(r.nev || r.vonalkod)}</b>
        <span>Vonalkód: ${escapeHtml(r.vonalkod)} · Saját cikkszám: ${escapeHtml(r.sajat_cikkszam || "—")} · Gyártói cikkszám: ${escapeHtml(r.gyartoi_cikkszam || "—")}</span>
        <span>Rendszer: ${r.rendszer_mennyiseg} db · Számolt: ${r.szamolt_mennyiseg} db</span>
        ${sectorChips ? `<div class="sectorBreakdown">${sectorChips}</div>` : ""}
        ${others ? `<span class="otherWarehouses">Más raktárak — ${others}</span>` : ""}
        ${recountNote}
      </div>
      <div class="diffVal ${cls}">${sign}${r.elteres} db<br><span style="font-size:11px; font-weight:600;">${sign}${formatFt(r.elteres_ertek)}</span></div>
    </div>`;
}

let selectedDiffBarcodes = new Set();

async function createVerificationRoundForSelected(leltarId) {
  if (!selectedDiffBarcodes.size) { alert("Válassz ki legalább egy tételt a checkbox-okkal."); return; }
  const btn = el("createVerifyBtn");
  btn.disabled = true;
  btn.textContent = "QR generálása…";
  try {
    const result = await apiPost({
      action: "create_verification_round",
      leltar_id: leltarId,
      barcodes: Array.from(selectedDiffBarcodes),
    });
    if (result.error) { alert("Hiba: " + result.error); }
    else {
      showVerifyQr(result.kod, result.tetelek_szama);
      selectedDiffBarcodes.clear();
    }
  } catch (e) {
    alert("Hiba: " + e.message);
  }
  btn.disabled = false;
  btn.textContent = "Kiválasztottak ellenőrzése (új QR)";
}

function showVerifyQr(kod, tetelekSzama) {
  const card = el("verifyQrCard");
  card.style.display = "block";
  card.innerHTML = `
    <div class="cardTitle">Ellenőrzési QR-kód (${tetelekSzama} tétel)</div>
    <div class="activeLeltarCard">
      <div id="verifyQrWrap" class="qrBox"><canvas width="150" height="150"></canvas></div>
      <div class="info">
        <div class="codeValue">${escapeHtml(kod)}</div>
        <div class="metaLine">Olvastasd be ezt a telefonnal — csak a kiválasztott tételeket fogja mutatni újraszámolásra.
        Akárhányszor generálhatsz újabb ellenőrzési QR-t, amíg a leltár nyitva van.</div>
      </div>
    </div>
  `;
  renderQrInto("verifyQrWrap", buildVerifyUrl(kod));
  card.scrollIntoView({ behavior: "smooth" });
}

function buildVerifyUrl(kod) {
  return `${SCANNER_URL}?verify=${encodeURIComponent(kod)}`;
}

async function closeLeltarAction(leltarId) {
  if (!confirm("Biztosan lezárod a leltárat? Ezután már nem lehet több beolvasást/ellenőrzést hozzáadni.")) return;
  try {
    const result = await apiPost({ action: "close_leltar", leltar_id: leltarId });
    if (result.error) { alert("Hiba: " + result.error); return; }
    renderFullReport(el("reportContainer"), result.report, { showActions: false });
    loadActiveLeltarak();
  } catch (e) {
    alert("Hiba a lezáráskor: " + e.message);
  }
}

/* =========================================================================
   KORÁBBI LELTÁRAK
   ========================================================================= */
async function loadHistory() {
  const wrap = el("historyList");
  wrap.innerHTML = `<p class="emptyNote">Betöltés…</p>`;
  try {
    const data = await apiGet({ action: "history" });
    const list = data.leltarak || [];
    if (!list.length) { wrap.innerHTML = `<p class="emptyNote">Még nincs egyetlen leltár sem.</p>`; return; }
    wrap.innerHTML = list.map(l => `
      <div class="historyRow" data-leltar="${escapeHtml(l.leltar_id)}">
        <div>
          <b>${escapeHtml(formatDateTime(l.inditva))}</b>
          <div class="meta">Indította: ${escapeHtml(l.inditotta)} · Típus: ${escapeHtml(l.tipus)} · Raktár: ${escapeHtml(l.raktar)}</div>
        </div>
        <span class="statusPill ${l.statusz === "folyamatban" ? "folyamatban" : "lezart"}">${l.statusz === "folyamatban" ? "Folyamatban" : "Lezárva"}</span>
      </div>
    `).join("");
    wrap.querySelectorAll(".historyRow").forEach(row => {
      row.addEventListener("click", () => {
        openReport(row.dataset.leltar, el("historyReportContainer"), { showActions: row.querySelector(".folyamatban") !== null });
      });
    });
  } catch (e) {
    wrap.innerHTML = `<p class="emptyNote">Hiba: ${escapeHtml(e.message)}</p>`;
  }
}

loadActiveLeltarak();

/* ---------- QR-kód generálás (kliens oldali) ---------- */
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}
let qrLibPromise = null;
function ensureQrLib() {
  if (!qrLibPromise) qrLibPromise = loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js");
  return qrLibPromise;
}
ensureQrLib().catch(() => {});

function buildJoinUrl(code) {
  return `${SCANNER_URL}?join=${encodeURIComponent(code)}`;
}

async function renderQrInto(wrapId, text) {
  try {
    await ensureQrLib();
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const canvas = document.querySelector(`#${CSS.escape(wrapId)} canvas`);
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const size = canvas.width;
    const count = qr.getModuleCount();
    const cell = size / count;
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#000";
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) ctx.fillRect(c * cell, r * cell, cell, cell);
      }
    }
  } catch (e) { /* nem kritikus, ha a QR nem generálódik, a kód szövegesen ott van */ }
}

el("checkBtn").addEventListener("click", runCheck);
el("checkBarcodeInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") runCheck();
});

async function runCheck() {
  const barcode = el("checkBarcodeInput").value.trim();
  if (!barcode) return;
  const card = el("checkResultCard");
  card.style.display = "block";
  card.innerHTML = `<p class="emptyNote">Keresés…</p>`;
  try {
    const data = await apiGet({ action: "check_stock", barcode: barcode });
    if (!data.found) {
      card.innerHTML = `<p class="emptyNote">A(z) ${escapeHtml(barcode)} vonalkód nem található a terméktörzsben.</p>`;
      return;
    }
    const sizesHtml = data.sizes.length
      ? data.sizes.map(s => `
          <div class="checkSizeRow">
            <span>${escapeHtml(s.meret)}</span>
            <span class="qty${s.mennyiseg === 0 ? " zero" : ""}">${s.mennyiseg} db</span>
          </div>`).join("")
      : `<p class="emptyNote">Nincs készlet-adat ehhez a modellhez.</p>`;
    card.innerHTML = `
      <div class="checkResultCard">
        <div class="modelName">${escapeHtml(data.nev)}</div>
        <div class="modelCode">${escapeHtml(data.modell)}</div>
        ${sizesHtml}
      </div>`;
  } catch (e) {
    card.innerHTML = `<p class="emptyNote">Hiba: ${escapeHtml(e.message)}</p>`;
  }
}

} catch (e) {
  alert("KRITIKUS HIBA a szkriptben: " + (e && e.stack ? e.stack : e));
}
