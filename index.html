<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leltár szkenner</title>
<style>
  :root{
    --bg:#0d1210;
    --panel:#161d1a;
    --panel-2:#1f2925;
    --line:#2a3530;
    --text:#eef2f0;
    --text-dim:#8fa199;
    --accent:#3ecf8e;
    --accent-dim:#1f6b4c;
    --warn:#e0a63e;
    --danger:#e0553e;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overscroll-behavior:none;}
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---------- Fejléc ---------- */
  header{flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line);}
  header select{
    flex:1; background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 10px; font-size:15px; font-weight:500;}
  .stat{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2;}
  .stat b{font-size:16px; font-weight:600;}
  .stat span{font-size:11px; color:var(--text-dim);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--text-dim); flex:0 0 auto;}
  .dot.online{background:var(--accent);}
  .dot.offline{background:var(--danger);}

  /* ---------- Fő terület (kamera + húzható lista együtt) ---------- */
  #mainArea{position:relative; flex:1 1 auto; min-height:0; overflow:hidden;}

  /* ---------- Kamera terület ---------- */
  #camWrap{position:absolute; inset:0; background:#000; overflow:hidden;}
  video{width:100%; height:100%; object-fit:cover; display:block;}
  canvas#overlay{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}

  .guide{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:78%; max-width:420px; aspect-ratio:16/9;
    border:2px solid rgba(255,255,255,0.28); border-radius:16px; pointer-events:none;
    transition:border-color .15s ease, box-shadow .15s ease;}
  .guide.active{border-color:var(--accent); box-shadow:0 0 0 4px rgba(62,207,142,0.25);}
  .guide::before,.guide::after{content:""; position:absolute; width:22px; height:22px;
    border-color:var(--accent); border-style:solid;}
  .guide::before{top:-2px; left:-2px; border-width:3px 0 0 3px; border-top-left-radius:16px;}
  .guide::after{bottom:-2px; right:-2px; border-width:0 3px 3px 0; border-bottom-right-radius:16px;}

  .scanLine{
    position:absolute; left:4%; right:4%; top:50%; height:2px; border-radius:2px;
    background:var(--accent); box-shadow:0 0 10px 2px rgba(62,207,142,0.75);
    transform:translateY(-50%);}

  #camWrap.flash::after{content:""; position:absolute; inset:0; background:var(--accent);
    opacity:0; animation: flashPulse .35s ease-out; pointer-events:none;}
  @keyframes flashPulse{0%{opacity:.35;} 100%{opacity:0;}}
  @keyframes focusRipple{0%{transform:scale(0.6); opacity:1;} 100%{transform:scale(1.15); opacity:0;}}

  #camMsg{position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    text-align:center; padding:24px; color:var(--text-dim); font-size:14px; background:var(--bg);}
  #camMsg.show{display:flex;}

  /* ---------- Aktuális találat kártya ---------- */
  #hit{
    position:absolute; left:12px; right:12px; bottom:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; display:none; box-shadow:0 8px 24px rgba(0,0,0,0.4);
    transform:translateY(12px); opacity:0; transition:transform .18s ease, opacity .18s ease;}
  #hit.show{display:block; transform:translateY(0); opacity:1;}
  #hit.unknown{border-color:var(--warn);}
  .hitTop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .hitName{font-size:17px; font-weight:600; line-height:1.25;}
  .hitBarcode{font-size:12px; color:var(--text-dim); margin-top:2px; font-variant-numeric:tabular-nums;}
  .hitBadge{font-size:11px; padding:3px 8px; border-radius:999px; background:var(--accent-dim);
    color:var(--accent); font-weight:600; white-space:nowrap;}
  .hitBadge.warn{background:#4a3a17; color:var(--warn);}

  .qtyRow{display:flex; align-items:center; gap:8px; margin-top:12px;}
  .qtyBtn{width:40px; height:44px; flex:0 0 40px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:20px; font-weight:600;}
  .qtyBtn:active{background:var(--line);}
  #qtyInput{flex:1 1 0; min-width:0; text-align:center; font-size:22px; font-weight:600; height:44px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; color:var(--text);}
  #nextBtn{flex:0 0 auto; height:44px; padding:0 14px; border-radius:10px; border:none;
    background:var(--accent); color:#06231a; font-size:15px; font-weight:700;}

  /* ---------- Húzható lista-panel (sheet), a kamera fölé csúszik ---------- */
  #sheet{position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    justify-content:flex-end; pointer-events:none;}
  #sheet.empty{display:none;}
  #sheetPanel{pointer-events:auto; height:100%; display:flex; flex-direction:column;
    background:var(--panel); border-radius:16px 16px 0 0; border-top:1px solid var(--line);
    box-shadow:0 -6px 24px rgba(0,0,0,0.4);
    transform:translateY(calc(100% - 112px));
    transition:transform .25s cubic-bezier(.2,.8,.2,1);}
  #sheetPanel.dragging{transition:none;}
  #sheetPanel.bump{animation: sheetBump .28s ease;}
  @keyframes sheetBump{0%{transform:translateY(calc(100% - 112px));}
    35%{transform:translateY(calc(100% - 122px));} 100%{transform:translateY(calc(100% - 112px));}}
  #sheetHandle{flex:0 0 auto; padding:10px 0 4px; display:flex; justify-content:center;
    cursor:grab; touch-action:none;}
  .handleGrip{width:40px; height:4px; border-radius:2px; background:var(--line);}
  #list{overflow-y:auto; flex:1 1 auto; min-height:0; -webkit-overflow-scrolling:touch;}
  .rowItem{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line);}
  .rowItem.latest{padding:14px 16px 16px;}
  .rowItem.latest .info b{font-size:17px; font-weight:600;}
  .rowItem.latest .qty{font-size:16px; padding:4px 10px; border-radius:999px;
    background:var(--accent-dim); color:var(--accent); font-weight:700;}
  .rowItem .info{flex:1; min-width:0;}
  .rowItem .info b{display:block; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rowItem .info span{font-size:11px; color:var(--text-dim);}
  .rowItem .qty{font-size:16px; font-weight:600; min-width:34px; text-align:right;}
  .rowItem button{background:none; border:none; color:var(--text-dim); font-size:18px; padding:4px 6px;}

  /* ---------- Lábléc ---------- */
  footer{flex:0 0 auto; display:flex; gap:10px; padding:10px 14px;
    background:var(--panel); border-top:1px solid var(--line);}
  footer button{flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:14px; font-weight:600;}
  footer button.primary{background:var(--accent); color:#06231a; border:none;}
  footer button:disabled{opacity:.4;}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
</style>
</head>
<body>
<div id="app">

  <header>
    <select id="sectorSelect" aria-label="Szektor kiválasztása">
      <option value="">Szektor kiválasztása…</option>
      <option>A-01</option><option>A-02</option><option>A-03</option>
      <option>B-01</option><option>B-02</option>
      <option>Raktár hátsó</option>
    </select>
    <div class="dot" id="netDot" title="Kapcsolat állapota"></div>
    <div class="stat">
      <b id="itemCount">0</b>
      <span>tétel</span>
    </div>
  </header>

  <div id="mainArea">
  <div id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="guide" id="guide" style="display:none;"><div class="scanLine" id="scanLine"></div></div>
    <div id="camMsg"></div>
    <button id="startBtn" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      padding:16px 28px; font-size:16px; font-weight:700; border:none; border-radius:12px;
      background:var(--accent); color:#06231a; z-index:5; display:none;">Kamera indítása</button>
    <div id="selectSectorHint" style="position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      color:var(--text-dim); font-size:14px; text-align:center; padding:0 24px;">
      Válassz szektort a kamera indításához ⬆️</div>
    <button id="torchBtn" style="position:absolute; top:8px; right:8px; width:40px; height:40px;
      border-radius:50%; border:1px solid rgba(255,255,255,0.3); background:rgba(0,0,0,0.5);
      color:#fff; font-size:18px; z-index:6; display:none;">🔦</button>
    <div id="debugBar" style="position:absolute; top:6px; left:8px; font-size:9px;
      color:rgba(255,255,255,0.35); font-family:monospace; pointer-events:none; z-index:2;"></div>

    <div id="hit">
      <div class="hitTop">
        <div>
          <div class="hitName" id="hitName">—</div>
          <div class="hitBarcode" id="hitBarcode">—</div>
        </div>
        <div class="hitBadge" id="hitBadge">ismert</div>
      </div>
      <div class="qtyRow">
        <button class="qtyBtn" id="qtyMinus" aria-label="Mennyiség csökkentése">–</button>
        <input id="qtyInput" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="Mennyiség">
        <button class="qtyBtn" id="qtyPlus" aria-label="Mennyiség növelése">+</button>
        <button id="nextBtn">Rögzít</button>
      </div>
    </div>
  </div>

  <div id="sheet" class="empty">
    <div id="sheetPanel">
      <div id="sheetHandle">
        <div class="handleGrip"></div>
      </div>
      <div id="list"></div>
    </div>
  </div>
  </div>

  <footer>
    <button id="closeSectorBtn">Szektor lezárása</button>
    <button id="syncBtn" class="primary">Szinkronizálás (<span id="pendingCount">0</span>)</button>
  </footer>

</div>

<script>
try {
/* =========================================================================
   DEMO TERMÉKTÖRZS
   Éles verzióban ez egy Apps Script Web App hívás lenne, ami a BigQuery
   cikktörzs táblát nézi le vonalkód alapján. Lásd a lookupProduct()
   függvényt legalul — ott van kikommentezve a valós fetch hívás.
   ========================================================================= */
const DEMO_PRODUCTS = {
  "5901234123457": "Coca-Cola 0,5L",
  "5449000000996": "Fanta Narancs 0,5L",
  "4006381333931": "Nivea testápoló 250ml",
  "8710398503968": "Pampers pelenka 4-es",
  "3017620422003": "Nutella 400g",
  "5000159407236": "Mars csokoládé",
  "7622210951557": "Milka tábla 100g",
  "5410228131488": "Jägermeister 0,7L",
};

/* =========================================================================
   ÁLLAPOT
   ========================================================================= */
let currentSector = "";
let scanned = [];              // { barcode, name, qty, ts }
let pendingHit = null;         // amit épp visszaigazolásra vár a kártya
let lastAcceptedCode = null;
let lastAcceptedAt = 0;
let candidateCode = null;
let candidateCount = 0;
let usingNative = false;
let barcodeDetector = null;
let zxingControls = null;

const el = (id) => document.getElementById(id);
function setCamMsg(text) {
  camMsg.textContent = text;
  camMsg.classList.toggle("show", !!text);
}
const video = el("video");
const overlay = el("overlay");
const ctx = overlay.getContext("2d");
const camMsg = el("camMsg");
const hitCard = el("hit");
const guide = el("guide");

/* =========================================================================
   HANG / REZGÉS VISSZAJELZÉS
   ========================================================================= */
const audioCtx = window.AudioContext ? new AudioContext() : null;
function beep(freq = 880, dur = 0.06) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = freq;
  o.type = "sine";
  g.gain.value = 0.15;
  o.connect(g).connect(audioCtx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.stop(audioCtx.currentTime + dur);
}
function haptic(ms = 30) { if (navigator.vibrate) navigator.vibrate(ms); }
function flashScreen() {
  const wrap = document.getElementById("camWrap");
  wrap.classList.remove("flash");
  void wrap.offsetWidth; // kényszerített reflow, hogy az animáció újrainduljon gyors egymás utáni scanneknél is
  wrap.classList.add("flash");
}

/* =========================================================================
   TERMÉK KERESÉS
   ========================================================================= */
async function lookupProduct(barcode) {
  // --- DEMO MÓD ---
  if (DEMO_PRODUCTS[barcode]) return { found: true, name: DEMO_PRODUCTS[barcode] };
  return { found: false, name: null };

  // --- ÉLES MÓD (Apps Script Web App hívás) ---
  // const res = await fetch(`${APPS_SCRIPT_URL}?action=lookup&barcode=${barcode}`);
  // const data = await res.json();
  // return { found: !!data.name, name: data.name || null };
}

/* =========================================================================
   KAMERA INDÍTÁS
   ========================================================================= */
let activeStream = null;

async function startCamera() {
  // A natív és a tartalék út SZÁNDÉKOSAN külön kezeli a kamerát —
  // korábban mindkettő megpróbálta lefoglalni, ami iOS-en ütközést okozott.
  if (!("BarcodeDetector" in window)) {
    debugLog("BarcodeDetector nem elérhető ebben a böngészőben, ZXing tartalék indítása...");
    startFallbackScanner();
    return;
  }

  debugLog("getUserMedia hívása (natív út)...");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 4096 }, height: { ideal: 2160 },
        advanced: [{ focusMode: "continuous" }] },
      audio: false,
    });
    debugLog("getUserMedia sikeres, videó lejátszása...");
    activeStream = stream;
    video.srcObject = stream;
    await video.play();
    debugLog("videó lejátszás elindult");
  } catch (err) {
    debugLog("getUserMedia HIBA: " + (err && err.message ? err.message : err) + " (" + (err && err.name) + ")");
    setCamMsg("A kamera nem érhető el. Engedélyezd a hozzáférést a böngésző beállításaiban.");
    return;
  }

  try {
    const supported = await BarcodeDetector.getSupportedFormats();
    const formats = supported.filter(f =>
      ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"].includes(f));
    if (!formats.length) throw new Error("Nincs használható formátum: " + supported.join(","));
    barcodeDetector = new BarcodeDetector({ formats });
    usingNative = true;
    setCamMsg("");
    refreshTorchButton();
    debugLog(`natív mód · formátumok: ${formats.join(", ")}`);
    requestAnimationFrame(nativeScanLoop);
  } catch (e) {
    debugLog("natív BarcodeDetector hiba, ZXing tartalék indítása: " + e.message);
    if (activeStream) { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
    startFallbackScanner();
  }
}

const APP_VERSION = "v28";
let frameCount = 0, detectCount = 0;
function debugLog(msg) {
  // A felületen csak a verziószám látszik (lásd lent) — a részletes
  // állapotüzenetek a böngésző konzoljába mennek, ott elérhetők
  // hibakereséshez, de nem zsúfolják a kamera-képet.
  console.log("[leltár]", msg);
}

/* =========================================================================
   KÖZÖS: a keret (guide) által kijelölt terület kivágása és felnagyítása
   Ez a legfontosabb javítás a felismerés megkönnyítésére — ahelyett, hogy
   a teljes videóképet elemeznénk (amiben egy távoli/kicsi vonalkód csak
   pár pixelt foglal el), csak a keretben lévő, felhasználó által
   pozicionált részt vizsgáljuk, felnagyítva. Ez mindkét motornál
   (natív és ZXing) jelentősen javítja a találati arányt.
   ========================================================================= */
const cropCanvas = document.createElement("canvas");
const cropCtx = cropCanvas.getContext("2d", { willReadFrequently: true });

function captureGuideCrop(upscale = 2.2) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;

  const videoRect = video.getBoundingClientRect();
  const guideRect = guide.getBoundingClientRect();

  // object-fit:cover miatt a videó egy része "levágva" látszik — ezt
  // ki kell számolni, hogy a keret pontos videó-pixel koordinátáit kapjuk.
  const scale = Math.max(videoRect.width / vw, videoRect.height / vh);
  const dispW = vw * scale, dispH = vh * scale;
  const offsetX = (dispW - videoRect.width) / 2;
  const offsetY = (dispH - videoRect.height) / 2;

  const sx = (guideRect.left - videoRect.left + offsetX) / scale;
  const sy = (guideRect.top - videoRect.top + offsetY) / scale;
  const sw = guideRect.width / scale;
  const sh = guideRect.height / scale;
  if (sw <= 0 || sh <= 0) return null;

  // Biztonsági levágás: a drawImage érvénytelen (negatív vagy a videó
  // méretén túlnyúló) forrás-téglalapra hibát dobna némely böngészőben.
  const sxC = Math.max(0, Math.min(sx, vw - 1));
  const syC = Math.max(0, Math.min(sy, vh - 1));
  const swC = Math.max(1, Math.min(sw, vw - sxC));
  const shC = Math.max(1, Math.min(sh, vh - syC));

  cropCanvas.width = Math.round(swC * upscale);
  cropCanvas.height = Math.round(shC * upscale);
  // A sima (nem kikapcsolt) simítás jobb eredményt ad a dekódolásnál,
  // mint az élesen pixeles verzió — a dekóder algoritmusok a finom
  // élátmenetekből pontosabban számolnak.
  cropCtx.imageSmoothingEnabled = true;
  cropCtx.imageSmoothingQuality = "high";
  cropCtx.drawImage(video, sxC, syC, swC, shC, 0, 0, cropCanvas.width, cropCanvas.height);

  return cropCanvas;
}

// Vizuális visszajelzés a keret felvillanásával, amikor a kivágott
// területen bármit felismer a motor (pontos körvonal helyett — mert
// felnagyított/kivágott képen dolgozunk, a pontos pozíció nem 1:1
// mapolható vissza egyszerűen a képernyőre).
let guideActiveTimeout = null;
function highlightGuide() {
  guide.classList.add("active");
  clearTimeout(guideActiveTimeout);
  guideActiveTimeout = setTimeout(() => guide.classList.remove("active"), 250);
}

/* =========================================================================
   NATÍV BARCODEDETECTOR CIKLUS — a kivágott, felnagyított területen dolgozik
   ========================================================================= */
async function nativeScanLoop() {
  try {
    if (video.readyState >= 2 && video.videoWidth) {
      frameCount++;
      const crop = captureGuideCrop();
      if (crop) {
        const barcodes = await barcodeDetector.detect(crop);
        if (barcodes.length) { detectCount++; highlightGuide(); }
        handleDetections(barcodes.map(b => b.rawValue));
      }
      if (frameCount % 20 === 0) {
        debugLog(`natív mód · videó: ${video.videoWidth}x${video.videoHeight} · `
          + `${frameCount} kocka feldolgozva · ${detectCount} találat`);
      }
    } else {
      debugLog(`videó nem kész (readyState=${video.readyState}, width=${video.videoWidth})`);
    }
  } catch (e) {
    debugLog("nativeScanLoop hiba: " + (e && e.message ? e.message : e));
  }
  requestAnimationFrame(nativeScanLoop);
}

/* =========================================================================
   FALLBACK: ZXing (Safari / iOS, ahol nincs natív BarcodeDetector)
   Itt is a kivágott, felnagyított területet elemezzük, saját ütemezett
   ciklusban — nem a könyvtár beépített, teljes képkockás folyamatos
   motorját használjuk, hogy egységes legyen a logika a natív úttal.
   ========================================================================= */

// Előtöltjük a ZXing könyvtárat MÁR az oldal betöltésekor, a háttérben —
// így gombnyomáskor nincs hálózati késleltetés, ami elszakítaná iOS-en
// a felhasználói érintésből eredő engedélyt a videó lejátszásához.
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src; s.onload = resolve; s.onerror = reject;
    document.head.appendChild(s);
  });
}

let fallbackLibPromise = null;
if (!("BarcodeDetector" in window)) {
  fallbackLibPromise = loadScript("https://cdn.jsdelivr.net/npm/zxing-wasm@latest/dist/iife/reader/index.js")
    .catch(e => { debugLog("előtöltési hiba (nem végzetes): " + e); });
}

async function startFallbackScanner() {
  setCamMsg("Tartalék szkenner betöltése…");

  try {
    if (!fallbackLibPromise) {
      fallbackLibPromise = loadScript("https://cdn.jsdelivr.net/npm/zxing-wasm@latest/dist/iife/reader/index.js");
    }
    await fallbackLibPromise;
  } catch (e) {
    setCamMsg("A szkenner könyvtár nem tölthető be.");
    debugLog("CDN betöltési hiba: " + e.message);
    return;
  }

  // Itt MI kérjük le a kamerát (folyamatos autófókusszal, ha a telefon
  // támogatja) — a WASM dekóder csak a kész képkockákat elemzi.
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 4096 }, height: { ideal: 2160 },
        advanced: [{ focusMode: "continuous" }],
      },
      audio: false,
    });
    activeStream = stream;
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    setCamMsg("A kamera nem érhető el. Engedélyezd a hozzáférést a böngésző beállításaiban.");
    debugLog("getUserMedia hiba: " + (e.message || e));
    return;
  }

  setCamMsg("");
  refreshTorchButton();
  debugLog(`tartalék mód (ZXing-WASM) · kamera fut · videó:${video.videoWidth}x${video.videoHeight}`);
  requestAnimationFrame(fallbackScanLoop);
}

let lastFallbackDecodeAt = 0;
let fallbackAttempts = 0, fallbackFound = 0;
async function fallbackScanLoop() {
  try {
    const now = Date.now();
    // A WASM dekódolás sokkal gyorsabb, mint a tiszta JS verzió volt,
    // ezért sűrűbben próbálkozhatunk anélkül, hogy akadozna a felület.
    if (now - lastFallbackDecodeAt > 90 && video.videoWidth) {
      lastFallbackDecodeAt = now;
      const crop = captureGuideCrop();
      if (crop) {
        fallbackAttempts++;
        try {
          const imageData = cropCtx.getImageData(0, 0, crop.width, crop.height);
          const results = await ZXingWASM.readBarcodesFromImageData(imageData, {
            tryHarder: true,
            maxSymbols: 1,
          });
          if (results && results.length) {
            fallbackFound++;
            highlightGuide();
            handleDetections([results[0].text]);
          } else {
            handleDetections([]);
          }
        } catch (e) {
          debugLog("ZXing-WASM decode hiba: " + (e && e.message ? e.message : e));
        }
        if (fallbackAttempts % 20 === 0) {
          debugLog(`tartalék (ZXing-WASM) · ${fallbackAttempts} próbálkozás · ${fallbackFound} találat`);
        }
      }
    }
  } catch (e) {
    debugLog("fallbackScanLoop hiba: " + (e && e.message ? e.message : e));
  }
  requestAnimationFrame(fallbackScanLoop);
}

/* =========================================================================
   FELISMERÉS FELDOLGOZÁSA
   - Mindkét motor (natív és ZXing) belsőleg ellenőrzi a vonalkód
     ellenőrző-számjegyét (checksum) dekódoláskor — egyetlen sikeres
     olvasás is megbízható, nem kell több egymást követő találat.
   - Ha egy MÁSIK kódot ismer fel, miközben az előző kártya még nyitva
     van, az előzőt az aktuális mennyiséggel automatikusan rögzíti,
     és rögtön az újra vált — ez adja a gördülékeny, megállás nélküli
     scannelést.
   - Ugyanaz a vonalkód csak akkor számít "újra beolvasottnak" (és
     kapja +1-et a mennyisége), ha közben egy pillanatra eltűnt a
     képből — ez engedi, hogy pl. két egyforma terméket egymás után
     beolvass anélkül, hogy várni kelljen, de véd az ellen, hogy
     ugyanaz a mozdulatlan termék véletlenül duplán számoljon.
   ========================================================================= */
let lastSeenAt = 0;
function handleDetections(codes) {
  if (!codes.length) {
    candidateCode = null;
    candidateCount = 0;
    // Csak akkor számít ténylegesen "eltűntnek" a kód, ha egy ideje
    // (kb. fél másodperce) folyamatosan nem látja — így egy-egy
    // véletlenül kihagyott képkocka (gyakori a gyors, natív ciklusnál)
    // nem okoz azonnali, pörgős újra-beolvasást/villogást.
    if (Date.now() - lastSeenAt > 500) lastAcceptedCode = null;
    return;
  }

  lastSeenAt = Date.now();

  // A guide-hoz legközelebbi / első kódot vesszük célnak.
  const code = codes[0];
  candidateCode = code;
  candidateCount = 1;

  if (code === lastAcceptedCode) return; // ugyanaz a kód, még mindig folyamatosan látszik
  if (pendingHit && code === pendingHit.barcode) return; // már ez van kártyán

  acceptCode(code);
}

async function acceptCode(barcode) {
  lastAcceptedCode = barcode;

  // Ha volt függőben lévő tétel, azt előbb véglegesítjük az aktuális mennyiséggel.
  if (pendingHit) commitPending();

  beep(880); haptic(25); flashScreen();

  const existing = scanned.find(s => s.barcode === barcode && s.sector === currentSector);
  const result = await lookupProduct(barcode);

  pendingHit = {
    barcode,
    name: result.found ? result.name : "Ismeretlen vonalkód",
    found: result.found,
    qty: existing ? existing.qty + 1 : 1,
    existing: !!existing,
  };
  renderHitCard();
}

function renderHitCard() {
  if (!pendingHit) { hitCard.classList.remove("show"); return; }
  el("hitName").textContent = pendingHit.name;
  el("hitBarcode").textContent = pendingHit.barcode;
  el("qtyInput").value = pendingHit.qty;
  const badge = el("hitBadge");
  if (pendingHit.found) {
    badge.textContent = pendingHit.existing ? "már szkennelve" : "ismert termék";
    badge.className = "hitBadge";
    hitCard.classList.remove("unknown");
  } else {
    badge.textContent = "nincs a törzsben";
    badge.className = "hitBadge warn";
    hitCard.classList.add("unknown");
  }
  hitCard.classList.add("show");
  el("qtyInput").focus();
  el("qtyInput").select();
}

function commitPending() {
  if (!pendingHit) return;
  const qty = Math.max(1, parseInt(el("qtyInput").value || "1", 10));
  const existing = scanned.find(s => s.barcode === pendingHit.barcode && s.sector === currentSector);
  if (existing) {
    existing.qty = qty;
    existing.ts = Date.now();
  } else {
    scanned.unshift({
      barcode: pendingHit.barcode,
      name: pendingHit.name,
      qty,
      sector: currentSector,
      ts: Date.now(),
    });
  }
  pendingHit = null;
  hitCard.classList.remove("show");
  renderList();
}

   UI ESEMÉNYEK
   ========================================================================= */
el("qtyMinus").addEventListener("click", () => {

el("closeSectorBtn").addEventListener("click", () => {
  if (pendingHit) commitPending();
  if (!currentSector) return;
  alert(`"${currentSector}" szektor lezárva. Tételek: ${scanned.filter(s => s.sector === currentSector).length}`);
});

el("syncBtn").addEventListener("click", async () => {
  if (pendingHit) commitPending();
  const btn = el("syncBtn");
  btn.disabled = true;
  btn.textContent = "Szinkronizálás…";
  // --- ÉLES MÓD ---
  // await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify(scanned) });
  await new Promise(r => setTimeout(r, 600)); // demo késleltetés
  scanned.forEach(s => s.synced = true);
  btn.disabled = false;
  updatePendingCount();

});

function updatePendingCount() {
  const pending = scanned.filter(s => !s.synced).length;
  el("pendingCount") && (el("pendingCount").textContent = pending);
}

/* =========================================================================
   LISTA MEGJELENÍTÉS (húzható panel)
   - A lista mindig a legutolsó beolvasott tétellel kezdődik (kiemelt,
     nagyobb stílussal, mint a beolvasás utáni kártya).
   - Összecsukott állapotban a panel csak ennyit mutat, a kamera-kép
     látszik fölötte.
   - Felfelé húzva a fogantyút, a panel rácsúszik a kamera-képre és a
     teljes lista görgethetővé válik. Lefelé húzva visszacsukódik.
   ========================================================================= */
let sheetExpanded = false;
let lastRenderedCount = 0;

function renderList() {
  const items = scanned.filter(s => !currentSector || s.sector === currentSector);
  el("itemCount").textContent = items.length;
  updatePendingCount();

  const sheet = el("sheet");
  const list = el("list");
  if (!items.length) {
    sheet.classList.add("empty");
    list.innerHTML = "";
    lastRenderedCount = 0;
    return;
  }
  sheet.classList.remove("empty");

  list.innerHTML = items.map((s, i) => `
    <div class="rowItem${i === 0 ? " latest" : ""}">
      <div class="info">
        <b>${escapeHtml(s.name)}</b>
        <span>${s.barcode} · ${s.sector}</span>
      </div>
      <div class="qty">${s.qty} db</div>
      <button data-barcode="${s.barcode}" data-sector="${s.sector}" aria-label="Tétel törlése">✕</button>
    </div>
  `).join("");

  list.querySelectorAll("button[data-barcode]").forEach(btn => {
    btn.addEventListener("click", () => {
      scanned = scanned.filter(s => !(s.barcode === btn.dataset.barcode && s.sector === btn.dataset.sector));
      renderList();
    });
  });

  // Bump animáció, ha új tétel érkezett, és összecsukott állapotban vagyunk.
  const sheetPanel = el("sheetPanel");
  if (!sheetExpanded && items.length > lastRenderedCount) {
    sheetPanel.classList.remove("bump");
    void sheetPanel.offsetWidth;
    sheetPanel.classList.add("bump");
  }
  lastRenderedCount = items.length;
}

/* ---------- Húzás kezelése (érintés és egér is) ---------- */
const sheetPanelEl = () => el("sheetPanel");
const COLLAPSED_OFFSET_PX = 112; // ennyi px látszik összecsukva (lásd CSS)
let dragStartY = null, dragStartTranslate = 0;

function setSheetState(expanded, animate = true) {
  sheetExpanded = expanded;
  const panel = sheetPanelEl();
  panel.classList.toggle("dragging", false);
  panel.style.transition = animate ? "" : "none";
  panel.style.transform = expanded ? "translateY(0)" : "";
  if (!animate) void panel.offsetWidth;
}

function currentTranslateY(panel) {
  const t = getComputedStyle(panel).transform;
  if (t === "none") return 0;
  const m = new DOMMatrixReadOnly(t);
  return m.m42;
}

function dragStart(clientY) {
  const panel = sheetPanelEl();
  dragStartY = clientY;
  dragStartTranslate = currentTranslateY(panel);
  panel.classList.add("dragging");
}
function dragMove(clientY) {
  if (dragStartY === null) return;
  const panel = sheetPanelEl();
  const maxY = panel.offsetHeight - COLLAPSED_OFFSET_PX;
  let newY = dragStartTranslate + (clientY - dragStartY);
  newY = Math.max(0, Math.min(maxY, newY));
  panel.style.transform = `translateY(${newY}px)`;
}
function dragEnd(clientY) {
  if (dragStartY === null) return;
  const delta = clientY - dragStartY;
  dragStartY = null;
  el("sheetPanel").classList.remove("dragging");
  if (Math.abs(delta) < 6) setSheetState(!sheetExpanded);       // koppintás = váltás
  else if (delta < -40) setSheetState(true);                    // felfelé húzás = nyit
  else if (delta > 40) setSheetState(false);                    // lefelé húzás = csuk
  else setSheetState(sheetExpanded);                            // kis mozgás = visszapattan
}

const handle = document.getElementById("sheetHandle");
handle.addEventListener("touchstart", e => dragStart(e.touches[0].clientY), { passive: true });
handle.addEventListener("touchmove", e => dragMove(e.touches[0].clientY), { passive: true });
handle.addEventListener("touchend", e => dragEnd(e.changedTouches[0].clientY));
handle.addEventListener("mousedown", e => {
  dragStart(e.clientY);
  const onMove = ev => dragMove(ev.clientY);
  const onUp = ev => {
    dragEnd(ev.clientY);
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
});

// Ha kibontott állapotban a lista tetejére görgetünk, és onnan tovább
// próbálnánk felfelé húzni (rugalmas túlhúzás), az a becsukást is
// elindíthatja — de csak a lista tetején állva induló húzás esetén.
document.getElementById("list").addEventListener("touchstart", e => {
  if (sheetExpanded && el("list").scrollTop === 0) {
    dragStart(e.touches[0].clientY);
  }
}, { passive: true });
document.getElementById("list").addEventListener("touchmove", e => {
  if (dragStartY !== null) dragMove(e.touches[0].clientY);
}, { passive: true });
document.getElementById("list").addEventListener("touchend", e => {
  if (dragStartY !== null) dragEnd(e.changedTouches[0].clientY);
});

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* =========================================================================
   VAKU (torch) és ÉRINTÉSRE-FÓKUSZ
   Fontos: iOS Safari-n ezek jellemzően NEM támogatottak webes API-n
   keresztül (Apple oldali korlátozás) — ott a gombok/érintés egyszerűen
   nem csinálnak semmit, hibaüzenet nélkül. Android Chrome-on sok
   eszközön működnek.
   ========================================================================= */
let torchOn = false;

function getActiveVideoTrack() {
  return activeStream ? activeStream.getVideoTracks()[0] : null;
}

function refreshTorchButton() {
  const track = getActiveVideoTrack();
  const btn = el("torchBtn");
  if (!btn) return;
  try {
    const caps = track && track.getCapabilities ? track.getCapabilities() : null;
    btn.style.display = (caps && caps.torch) ? "flex" : "none";
  } catch (e) {
    btn.style.display = "none";
  }
}

el("torchBtn").addEventListener("click", async () => {
  const track = getActiveVideoTrack();
  if (!track) return;
  try {
    torchOn = !torchOn;
    await track.applyConstraints({ advanced: [{ torch: torchOn }] });
    el("torchBtn").style.background = torchOn ? "var(--accent)" : "rgba(0,0,0,0.5)";
  } catch (e) {
    debugLog("vaku hiba: " + (e.message || e));
  }
});

// Érintésre-fókusz: a kamera-kép megérintett pontjára próbál fókuszálni,
// ahol a böngésző/eszköz ezt támogatja.
el("camWrap").addEventListener("click", async (ev) => {
  if (ev.target.closest("#startBtn, #torchBtn, #hit")) return;
  const track = getActiveVideoTrack();
  if (!track || !track.getCapabilities) return;

  const rect = el("camWrap").getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width;
  const y = (ev.clientY - rect.top) / rect.height;

  // Rövid vizuális visszajelzés az érintésnél, függetlenül attól,
  // hogy a fókuszálás ténylegesen támogatott-e az eszközön.
  showFocusRipple(ev.clientX - rect.left, ev.clientY - rect.top);

  try {
    const caps = track.getCapabilities();
    if (caps.pointsOfInterest) {
      await track.applyConstraints({ advanced: [{ pointsOfInterest: [{ x, y }] }] });
    }
    if (caps.focusMode && caps.focusMode.includes("single-shot")) {
      await track.applyConstraints({ advanced: [{ focusMode: "single-shot" }] });
    }
  } catch (e) {
    // Nem támogatott eszközön/böngészőn csendben nem csinál semmit.
  }
});

function showFocusRipple(x, y) {
  const ripple = document.createElement("div");
  ripple.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:56px; height:56px;
    margin:-28px 0 0 -28px; border:2px solid var(--accent); border-radius:50%;
    pointer-events:none; z-index:7; animation: focusRipple .5s ease-out forwards;`;
  el("camWrap").appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);
}

} catch (e) {
  alert("KRITIKUS HIBA a szkriptben: " + (e && e.stack ? e.stack : e));
}
</script>
